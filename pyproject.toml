[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-cameras"
version = "2.8.0b1"
description = "Black Diamond Hub app: live camera feeds via go2rtc and UniFi Protect"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.42,<1",
    "Pillow>=10",
    "requests",
    "uiprotect>=25,<26",
]

[project.urls]
Source = "https://github.com/blackdiamondhub/bdh-app-cameras"

[project.entry-points."blackdiamondhub.plugins"]
cameras = "cameras.plugin:spec"

# How the platform builds this app's image (bdh-sdk builder/README.md).
# uiprotect requires PyAV (~60 MB of FFmpeg) only for talkback/audio, which
# this app never uses; cameras/events.py imports uiprotect without it.
[tool.bdh]
pip_exclude = ["av"]

[tool.setuptools.packages.find]
include = ["cameras", "cameras.*"]

[tool.setuptools.package-data]
cameras = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
