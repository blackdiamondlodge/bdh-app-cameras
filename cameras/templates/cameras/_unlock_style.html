{% comment %}
Hold-to-unlock door button, shared by the cameras page and the pop-up.
Include inside a <style>; the page positions `.cam-unlock-wrap`. The wrap
gets `data-unlock` = holding|pending|ok|maybe|err. Solid backgrounds, no
blur, and the only looping animation is a transform (README "Display
performance"); the ring's 3 s fill is a short stroke transition on a small
element.
{% endcomment %}
    .cam-unlock-wrap { display: none; position: absolute; z-index: 5; align-items: center; gap: 12px; pointer-events: none; }
    .cam-unlock {
        pointer-events: auto; position: relative; flex: none; width: 56px; height: 56px; padding: 0;
        border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(10,18,28,.7); color: #fff;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    .cam-unlock .ico { width: 24px; height: 24px; fill: currentColor; }
    .cam-unlock .ico-open { display: none; }
    .cam-unlock .ring {
        position: absolute; left: -5px; top: -5px; width: 66px; height: 66px; transform: rotate(-90deg);
        pointer-events: none; overflow: visible;
    }
    .cam-unlock .ring circle { fill: none; stroke-width: 4; }
    .cam-unlock .ring .track { stroke: rgba(255,255,255,.18); }
    .cam-unlock .ring .fill {
        stroke: #5ba4e6; stroke-linecap: round; stroke-dasharray: 188.5; stroke-dashoffset: 188.5; transition: none;
    }
    .cam-unlock-wrap[data-unlock="holding"] .ring .fill { stroke-dashoffset: 0; transition: stroke-dashoffset 3s linear; }
    .cam-unlock-wrap[data-unlock="pending"] .ring .fill { stroke-dashoffset: 130; }
    .cam-unlock-wrap[data-unlock="pending"] .ring { animation: cam-unlock-spin .9s linear infinite; }
    @keyframes cam-unlock-spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
    .cam-unlock-wrap[data-unlock="ok"] .ring .fill,
    .cam-unlock-wrap[data-unlock="maybe"] .ring .fill,
    .cam-unlock-wrap[data-unlock="err"] .ring .fill { stroke-dashoffset: 0; }
    .cam-unlock-wrap[data-unlock="ok"] .ring .fill { stroke: #3ccf6e; }
    .cam-unlock-wrap[data-unlock="ok"] .cam-unlock { background: rgba(24,110,56,.9); }
    .cam-unlock-wrap[data-unlock="maybe"] .ring .fill { stroke: #f0a030; }
    .cam-unlock-wrap[data-unlock="err"] .ring .fill { stroke: #e8243a; }
    .cam-unlock-wrap[data-unlock="ok"] .ico-shut,
    .cam-unlock-wrap[data-unlock="maybe"] .ico-shut { display: none; }
    .cam-unlock-wrap[data-unlock="ok"] .ico-open,
    .cam-unlock-wrap[data-unlock="maybe"] .ico-open { display: block; }
    .cam-unlock-msg {
        padding: 8px 14px; border-radius: 999px; background: rgba(10,18,28,.85); border: 1px solid rgba(255,255,255,.12);
        color: #fff; font: 600 15px system-ui, sans-serif; white-space: nowrap; opacity: 0; transition: opacity .2s;
    }
    .cam-unlock-wrap[data-unlock] .cam-unlock-msg { opacity: 1; }
    .cam-unlock-wrap[data-unlock="ok"] .cam-unlock-msg { color: #8fe3a8; }
    .cam-unlock-wrap[data-unlock="maybe"] .cam-unlock-msg { color: #ffc35c; }
    .cam-unlock-wrap[data-unlock="err"] .cam-unlock-msg { color: #ff8a96; }
